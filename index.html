function accountBodyOld(id){
  const a=S.accounts[id], n=note(id), st=accountStatus(id), g=gatesFor(id);
  const addr=[a.addr,a.city,a.zip].filter(Boolean).join(", ");
  const maps = "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([a.name,addr].join(" "));
  const search = "https://www.google.com/search?q="+encodeURIComponent([a.name,a.city].filter(Boolean).join(" "));
  let h = `<div class="stack">
  <div><div class="row" style="margin-bottom:6px">${a.list==="mimo"?'<span class="pill">MIMO list</span>':'<span class="pill">Approved list</span>'}<span class="pill ${st.tone}">${esc(st.t)}</span>${a.bizType?`<span class="pill">${esc(a.bizType)}</span>`:""}</div>
    <div>${esc(addr)||'<span class="muted">No address</span>'}</div>
    ${(a.altNames||[]).length?`<div class="small" style="margin-top:2px"><b>Also on the list for this premise:</b> ${esc(a.altNames.join(", "))}</div>`:""}
    <div class="small muted">${a.acct?`Account <span class="mono">${esc(a.acct)}</span>`:""}${a.phone?` · ${esc(a.phone)}`:""}${a.contact?` · ${esc(a.contact)}`:""}</div>
    <div class="row" style="margin-top:6px"><a class="btn ghost" href="${maps}" target="_blank" rel="noopener">Open in Maps</a><a class="btn ghost" href="${search}" target="_blank" rel="noopener">Search the web</a><button class="btn ghost" data-act="editacct" data-id="${esc(id)}">Edit</button></div></div>`;
  h += briefHtml(n, a);
  if(n.changes && n.changes.length && n.brief){
    const latest = n.changes.filter(c=>c.at===n.brief.researchedAt);
    if(latest.length) h += `<div class="card small"><h3 style="margin-bottom:6px">Changed since ${fmtDate(todayStr(new Date(latest[0].since)))}</h3>${latest.map(c=>`<div style="padding:4px 0;border-top:1px solid var(--line)"><b>${FIELD_LABEL[c.field]||c.field}</b><div class="muted"><s>${esc(c.from)}</s></div><div>${esc(c.to)}</div></div>`).join("")}<div class="muted" style="margin-top:6px">Earlier findings stay attached to this premise with their original dates. Old equipment and participation records belong to whoever was here then.</div></div>`;
  }
  if(a.list==="mimo" && !n.brief?.profile) h += `<div class="card"><h3 style="margin-bottom:8px">One address, two histories</h3><div class="mimo"><div class="hist"><b>Previous occupant</b>Was enrolled.${a.device?` Device on file: <b style="display:inline;text-transform:none;letter-spacing:0;font-size:13px">${esc(a.device)}</b>.`:" No device on file."}</div><div class="cur"><b>Current account</b>Needs fresh qualification and opt-in. Whether that device is still there, or still works, is unverified.</div></div></div>`;
  if(n.ret && n.ret.date) h += `<div class="banner ${n.ret.date<todayStr()?"warn":"demo"}"><div><b>Return ${fmtDate(n.ret.date)}${n.ret.time?" at "+esc(n.ret.time):""}</b> · ${n.ret.kind==="confirmed"?"Confirmed":n.ret.kind==="window"?"Specific window":"Vague"}${n.ret.note?`<div>${esc(n.ret.note)}</div>`:""}<div><button class="btn ghost" style="padding-left:0" data-act="clearret" data-id="${esc(id)}">Clear return</button></div></div></div>`;
  if(n.dm && (n.dm.name||n.dm.best)) h += `<div class="card small"><b>Decision-maker:</b> ${esc(n.dm.name||"Unknown")}${n.dm.role?` (${esc(n.dm.role)})`:""}${n.dm.best?`<br><b>Best time:</b> ${esc(n.dm.best)}`:""}</div>`;
  const gatesHtml = `<div><div class="section-h" style="margin-top:4px"><h2>Enrollment gates</h2><span class="muted">${Object.keys(g).length}/${GATES.length}</span></div><div class="card gates">${GATES.map(x=>`<div class="gate ${g[x.k]?"done":""}"><span class="g">${g[x.k]?"✓":""}</span><span>${x.t}</span>${g[x.k]?`<span class="when">${fmtDate(todayStr(new Date(g[x.k])))}</span>`:""}</div>`).join("")}</div></div>`;
  const links = researchLinks(a);
  h += `<details class="sources" ${n.brief?"":"open"}><summary><span>Sources and findings <span class="muted">${n.evidence.length}</span></span></summary><div style="margin-top:10px">`;
  if(!n.evidence.length) h += `<div class="card small" style="margin-bottom:8px">Nothing has been established about this business yet. Tap a dimension below to run a targeted search, then add what you find.</div>`;
  h += `<div class="stack">`;
  for(const [k,dm] of Object.entries(DIMS)){
    const evs = n.evidence.filter(e=>(e.dim||"business")===k);
    h += `<div><div class="spread" style="padding:4px 2px"><span><b>${dm.t}</b> <span class="muted small">${evs.length?evs.length:"Nothing yet"}</span></span><a class="btn ghost" style="min-height:32px" href="${links[k]}" target="_blank" rel="noopener">Search</a></div>`;
    const cov = (n.brief?.coverage||[]).filter(c=>c.dim===k);
    if(cov.length) h += `<div class="cov">${cov.map(c=>`${esc(c.checked)}: <span class="${c.result==="not_found"?"nf":""}">${c.result==="found"?"found":c.result==="not_found"?"not found (not proof it doesn't exist)":"not checked"}</span>`).join("<br>")}</div>`;
    h += evs.length ? `<div class="stack">${evs.map(e=>evidenceCard(id,e)).join("")}</div>` : (cov.length?"":`<div class="small muted" style="padding:0 2px 4px">${dm.d}</div>`);
    h += `</div>`;
  }
  h += `</div>`;
  h += `</div></details>` + gatesHtml + `<div><div class="section-h" style="margin-top:4px"><h2>Visits</h2><span class="muted">${n.visits.length}</span></div>`;
  h += n.visits.length ? `<div class="timeline">${n.visits.slice().reverse().map(v=>visitCard(id,v)).join("")}</div>` : `<div class="card small muted">No visits yet.</div>`;
  if(a.extra) h += `</div><details class="card small"><summary>Other columns from your list</summary><div class="mapgrid" style="margin-top:8px">${Object.entries(a.extra).map(([k,v])=>`<span class="col">${esc(k)}</span><span>${esc(v)}</span>`).join("")}</div></details>`;
  else h += `</div>`;
  return h + `</div>`;
}
const ST_LABEL={found:"Found",not_found:"Not found",not_checked:"Not checked",conflict:"Conflicting"};
function fieldHtml(f){
  if(!f) return "";
  const st=ST_LABEL[f.status]?f.status:"not_checked";
  return `<span class="st ${st}">${ST_LABEL[st]}</span>${f.value?esc(f.value):""}${f.source||f.date?`<div class="src">${f.link?`<a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.source||"Source")}</a>`:esc(f.source||"")}${f.date?" · "+fmtDate(f.date):""}</div>`:""}`;
}
function briefHtml(n, a){
  const b=n.brief;
  if(!b) return `<div class="card small">No research yet. Copy a research request from the Accounts or Today tab, send it to Claude, and import the file it gives you.</div>`;
  const p=b.profile||{}, s=b.story||{}, d=b.decision, t=b.thermostats, sal=SALIENCE[b.salience];
  const row=(k,v)=> v ? `<div class="row2"><div class="k">${k}</div><div>${v}</div></div>` : "";
  const sec=(title,rows)=>{ const r=rows.filter(Boolean); return r.length?`<section><h3 class="h-sub">${title}</h3><div class="brief dossier">${r.join("")}</div></section>`:""; };
  const kw = t && t.low!=null ? (t.high && t.high!=t.low ? `${(t.low*1.8).toFixed(1)}–${(t.high*1.8).toFixed(1)} kW` : `${(t.low*1.8).toFixed(1)} kW`) : "";
  const prog = a.list==="mimo" || a.device ? `${a.device?`Previous occupant had <b>${esc(a.device)}</b>. `:""}Fresh opt-in needed; current device unverified.<div class="src">Brian's list</div>` : "";
  let h = `<section class="picture"><h3 class="h-sub">The picture so far</h3><div class="brief">${s.summary?`<div class="story">${esc(s.summary)}<div class="when">Researched ${fmtDate(todayStr(new Date(b.researchedAt)))}</div></div>`:""}${b.askFirst?`<div class="ask"><b>Find out first</b>${esc(b.askFirst)}</div>`:""}</div></section>`;
  h += sec("The people", [
    d ? row("Who decides", `<b>${esc(ROUTES[d.route]||d.route||"Unknown")}</b>${d.who?`<div>${esc(d.who)}</div>`:""}${d.when?`<div>Best time: ${esc(d.when)}</div>`:""}${d.basis?`<div class="src">${esc(d.basis)}</div>`:""}`) : "",
    row("Owner", fieldHtml(p.owner)),
    row("Structure", fieldHtml(p.structure))
  ]);
  h += sec("The place", [
    row("Hours", fieldHtml(p.hours)),
    row("Occupancy", fieldHtml(p.occupancy) + ((a.altNames||[]).length?`<div class="src">Also on the list here: ${esc(a.altNames.join(", "))}</div>`:"")),
    row("Property", fieldHtml(p.property))
  ]);
  h += sec("The energy story", [
    sal ? row("Relevance", `<span class="pill ${sal.tone}">${sal.t}</span>`) : "",
    t ? row("At stake", `<b>${esc(t.low)}${t.high&&t.high!=t.low?"–"+esc(t.high):""} thermostat${(t.high||t.low)==1?"":"s"}</b> · ${kw}${t.basis?`<div class="src">${esc(t.basis)}</div>`:""}`) : "",
    row("Last HVAC work", fieldHtml(p.hvac)),
    row("Last electrical", fieldHtml(p.electrical)),
    row("Program history", prog)
  ]);
  if(b.watchouts && b.watchouts.length) h += `<section><h3 class="h-sub">Watch for</h3><div class="brief"><ul class="watch">${b.watchouts.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div></section>`;
  if((s.canInfer||[]).length || (s.cannotConclude||[]).length) h += `<details class="card small"><summary>What we can and can't conclude</summary>${(s.canInfer||[]).length?`<div style="margin-top:8px"><b>Reasonable to infer</b><ul>${s.canInfer.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}${(s.cannotConclude||[]).length?`<div><b>Not established</b><ul>${s.cannotConclude.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}</details>`;
  return h;
}
function evidenceCard(id,e){
  if(e.disputed) return `<div class="ev contradicts" style="opacity:.85"><div class="spread"><span class="claim"><s>${esc(e.claim)}</s></span><span class="pill bad">Disputed</span></div><div class="small" style="margin-top:4px"><b>Field correction ${fmtDate(todayStr(new Date(e.disputed.at)))}:</b> ${esc(e.disputed.note)}</div><div class="meta">Original source: ${esc(e.source)}${e.link?` · <a href="${esc(e.link)}" target="_blank" rel="noopener">open</a>`:""}</div><div class="act"><button class="btn ghost" data-act="undispute" data-id="${esc(id)}" data-ev="${esc(e.id)}">Undo</button></div></div>`;
  const meta = [esc(e.source), e.date?fmtDate(e.date):"", e.researchedAt?"researched "+fmtDate(todayStr(new Date(e.researchedAt))):"", e.time==="current"?"Current":"Historical", e.basis==="inferred"?"Inferred":"Observed", LEVEL[e.level]||"", e.verified?"Verified in field":"Needs field verification"].filter(Boolean).join(" · ");
  return `<div class="ev ${e.rel}"><div class="spread"><span class="claim">${esc(e.claim)}</span><span class="pill ${e.rel==="supports"?"good":e.rel==="contradicts"?"bad":e.rel==="mixed"?"warn":""}">${RELEVANCE[e.rel]}</span></div>${e.detail?`<div class="small" style="margin-top:4px">${esc(e.detail)}</div>`:""}<div class="meta">Source: ${meta}</div>${e.link?`<div class="small"><a href="${esc(e.link)}" target="_blank" rel="noopener">Open source</a></div>`:""}<div class="act">${e.verified?"":`<button class="btn ghost" data-act="verify" data-id="${esc(id)}" data-ev="${esc(e.id)}">Mark verified</button>`}<button class="btn ghost" data-act="dispute" data-id="${esc(id)}" data-ev="${esc(e.id)}">Wrong?</button><button class="btn ghost" data-act="editev" data-id="${esc(id)}" data-ev="${esc(e.id)}">Edit</button></div></div>`;
}
function openDispute(id, evId){
  const ev = note(id).evidence.find(x=>x.id===evId); if(!ev) return;
  openSheet("What's actually true?", ()=>`<div class="stack"><div class="card small"><b>Finding:</b> ${esc(ev.claim)}<div class="muted">Source: ${esc(ev.source)}</div></div><div class="field"><label for="dnote">What you saw or were told</label><textarea id="dnote" placeholder="Barbershop moved to Ste 141; Ste 139 is empty"></textarea><span class="hint">The original finding stays on record, marked as disputed, so you can see what changed and why.</span></div></div>`,
    `<button class="btn primary block" data-act="savedispute" data-id="${esc(id)}" data-ev="${esc(evId)}">Save correction</button>`, {back:()=>openSources(id)});
}
function visitCard(id,v){
  const o=OUTCOMES[v.result]||OUTCOMES.other, sub = v.sub && SUBS[v.result] ? SUBS[v.result].opts[v.sub] : "";
  return `<div class="visit"><div class="spread"><b>${o.label}</b><span class="muted small">${fmtWhen(v.at)}</span></div>${sub?`<div>${esc(sub)}</div>`:""}${v.result==="optin"?`<div>${v.level?esc(v.level)+"% participation":""}${v.kw?` · ${esc(v.kw)} kW`:""}${v.install?` · Install ${fmtDate(v.install)}`:""}</div>`:""}${v.notes?`<div class="muted" style="margin-top:4px">${esc(v.notes)}</div>`:""}<div class="small muted" style="margin-top:4px">${v.minutes||0} min on site · ${(v.gates||[]).length} gate${(v.gates||[]).length===1?"":"s"} reached <button class="btn ghost" style="min-height:0;padding:2px 6px" data-act="delvisit" data-id="${esc(id)}" data-v="${esc(v.id)}">Delete</button></div></div>`;
}

/* ---- Visit form ---- */
function openVisit(id, opts={}){
  const n=note(id), back=()=>openAccount(id);
  const V = {result:"", sub:"", gates:[], minutes:10, notes:"", retDate:"", retTime:"", retKind:"", retNote:"", dmName:n.dm?.name||"", dmRole:n.dm?.role||"", dmBest:n.dm?.best||"", level:"", kw:"", install:""};
  const radios = (name, obj, val) => `<div class="opts" role="radiogroup">${Object.entries(obj).map(([k,t])=>`<label class="opt"><input type="radio" name="${name}" value="${k}" ${val===k?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`;
  const body = () => {
    let h = `<form id="vform" class="stack" onsubmit="return false">
      <div class="field"><span class="lab">What happened?</span>${radios("result", Object.fromEntries(Object.entries(OUTCOMES).map(([k,o])=>[k,o.label])), V.result)}${V.result?`<span class="hint">Official disposition: ${OUTCOMES[V.result].official}</span>`:""}</div>`;
    if(SUBS[V.result]) h += `<div class="field"><span class="lab">${SUBS[V.result].q}</span>${radios("sub", SUBS[V.result].opts, V.sub)}</div>`;
    if(V.result==="optin") h += `<div class="field"><span class="lab">Participation level</span>${radios("level",{"50":"50%","75":"75%"},V.level)}</div>
      <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label for="kw">kW (if known)</label><input id="kw" name="kw" type="number" step="0.1" inputmode="decimal" value="${esc(V.kw)}"></div><div class="field" style="flex:1"><label for="install">Install date</label><input id="install" name="install" type="date" value="${esc(V.install)}"></div></div>`;
    if(V.result){
      h += `<div class="field"><span class="lab">Gates reached on this visit</span>${GATES.map(g=>`<label class="check"><input type="checkbox" name="gates" value="${g.k}" ${V.gates.includes(g.k)?"checked":""}><span>${g.t}</span></label>`).join("")}</div>`;
      const wantsReturn = RETURNABLE.has(V.result) || RETURNABLE.has(V.sub);
      h += `<div class="card stack"><h3>${wantsReturn?"When to come back":"Come back? (optional)"}</h3>
        <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label for="retDate">Date</label><input id="retDate" name="retDate" type="date" value="${esc(V.retDate)}"></div><div class="field" style="flex:1"><label for="retTime">Time</label><input id="retTime" name="retTime" type="time" value="${esc(V.retTime)}"></div></div>
        <div class="field"><span class="lab">How firm is it?</span>${radios("retKind",{confirmed:"Confirmed",window:"Specific window",vague:"Vague"},V.retKind)}</div>
        <div class="field"><label for="retNote">Reason to return</label><input id="retNote" name="retNote" type="text" value="${esc(V.retNote)}" placeholder="Owner in before 9am"></div></div>`;
      if(V.result!=="optin") h += `<div class="card stack"><h3>Decision-maker</h3>
        <div class="field"><label for="dmName">Name, if you learned it</label><input id="dmName" name="dmName" type="text" value="${esc(V.dmName)}"></div>
        <div class="field"><label for="dmRole">Role</label><input id="dmRole" name="dmRole" type="text" value="${esc(V.dmRole)}" placeholder="Owner, regional manager, landlord"></div>
        <div class="field"><label for="dmBest">Best time to catch them</label><input id="dmBest" name="dmBest" type="text" value="${esc(V.dmBest)}"></div></div>`;
      h += `<div class="card stack"><h3>Field check <span class="muted small">(measures research accuracy)</span></h3>
        <div class="field"><span class="lab">Did you read the FieldMind brief before this visit?</span>${radios("briefUsed",{yes:"Yes",no:"No"},V.briefUsed)}</div>
        <div class="field"><span class="lab">Business operating here matches the brief?</span>${radios("occMatch",{yes:"Yes",no:"No",unsure:"Couldn't tell",none:"No brief"},V.occMatch)}</div>
        <div class="field"><span class="lab">Who decides, as you found it</span>${radios("routeSeen",{owner_operator:"Owner on site",manager_needs_approval:"Manager, needs approval",corporate:"Corporate",landlord:"Landlord",unknown:"Couldn't tell"},V.routeSeen)}</div></div>`;
      h += `<div class="field"><label for="minutes">Minutes on site</label><input id="minutes" name="minutes" type="number" inputmode="numeric" min="0" value="${esc(V.minutes)}"></div>
        <div class="field"><label for="vnotes">Notes</label><textarea id="vnotes" name="notes" placeholder="What you saw, who you spoke with, what to check next time">${esc(V.notes)}</textarea></div>`;
    }
    return h + `</form>`;
  };
  const read = () => {
    const f=$("#vform"); if(!f) return;
    const fd=new FormData(f);
    for(const k of ["result","sub","level","retKind","briefUsed","occMatch","routeSeen"]) V[k]=fd.get(k)||"";
    for(const k of ["kw","install","retDate","retTime","retNote","dmName","dmRole","dmBest","minutes","notes"]) if(fd.has(k)) V[k]=fd.get(k);
    V.gates = fd.getAll("gates");
  };
  openSheet("Log visit", body, `<button class="btn primary block" data-act="savevisit">Save visit</button>`, {back, onOpen(){
    const f=$("#sheetBody");
    f.onchange = e => { const prev=V.result; read(); if(e.target.name==="result"||e.target.name==="sub"){ if(e.target.name==="result" && prev!==V.result){ V.sub=""; } if(!V.retKind && V.result==="followup") V.retKind="vague"; f.innerHTML=body(); } };
    f.oninput = () => read();
  }});
  UI.saveVisit = async () => {
    read();
    if(!V.result){ toast("Pick what happened first."); return; }
    if(SUBS[V.result] && !V.sub){ toast("Pick the detail behind that outcome."); return; }
    const v = {id:uid(), at:new Date().toISOString(), result:V.result, sub:V.sub, gates:V.gates, minutes:Number(V.minutes)||0, notes:V.notes.trim()};
    if(V.briefUsed||V.occMatch||V.routeSeen) v.fieldCheck = {briefUsed:V.briefUsed||"", occMatch:V.occMatch||"", routeSeen:V.routeSeen||"", briefRoute:n.brief?.decision?.route||"", briefOccupant:n.brief?.occupant?.name||"", briefResearchedAt:n.brief?.researchedAt||""};
    if(V.result==="optin"){ v.level=V.level; v.kw=V.kw?Number(V.kw):""; v.install=V.install; }
    n.visits.push(v);
    if(V.retDate) n.ret = {date:V.retDate, time:V.retTime, kind:V.retKind||"vague", note:V.retNote.trim()};
    else if(V.result==="optin" || V.result==="unqualified" || V.result==="not_interested") n.ret = null;
    if(V.dmName||V.dmRole||V.dmBest) n.dm = {name:V.dmName.trim(), role:V.dmRole.trim(), best:V.dmBest.trim()};
    n.today = false;
    try{ await Store.saveNote(id); }catch(e){ return; }
    toast(S.demo?"Logged (examples aren't saved)":"Visit saved");
    openAccount(id);
  };
}

/* ---- Evidence form ---- */
function openEvidence(id, evId){
  const n=note(id), existing = evId ? n.evidence.find(e=>e.id===evId) : null;
  const E = existing ? {dim:"business", ...existing} : {claim:"", detail:"", dim:"infrastructure", source:"Public permit", date:"", link:"", rel:"unknown", level:"premises", basis:"observed", time:"historical", verified:false};
  const radios = (name, obj, val) => `<div class="opts">${Object.entries(obj).map(([k,t])=>`<label class="opt"><input type="radio" name="${name}" value="${k}" ${val===k?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div>`;
  const body = () => `<form id="eform" class="stack" onsubmit="return false">
    <div class="field"><label for="claim">Finding</label><input id="claim" name="claim" type="text" value="${esc(E.claim)}" placeholder="Rooftop cooling unit replaced"><span class="hint">State only what the source shows. Keep guesses for Detail.</span></div>
    <div class="field"><span class="lab">Dimension</span>${radios("dim",Object.fromEntries(Object.entries(DIMS).map(([k,v])=>[k,v.t])),E.dim)}<span class="hint">For people, keep to professional roles and documented decisions. Leave out personal beliefs and private circumstances.</span></div>
    <div class="field"><label for="detail">Detail</label><textarea id="detail" name="detail" placeholder="Suite assignment unclear. Thermostat type unknown.">${esc(E.detail||"")}</textarea></div>
    <div class="row" style="flex-wrap:nowrap"><div class="field" style="flex:1"><label for="source">Source</label><select id="source" name="source">${SOURCES.map(s=>`<option ${s===E.source?"selected":""}>${s}</option>`).join("")}</select></div><div class="field" style="flex:1"><label for="edate">Date of record</label><input id="edate" name="date" type="date" value="${esc(E.date)}"></div></div>
    <div class="field"><label for="link">Link</label><input id="link" name="link" type="url" value="${esc(E.link)}" placeholder="https://"></div>
    <div class="field"><span class="lab">Does it help the case for this account?</span>${radios("rel",RELEVANCE,E.rel)}</div>
    <div class="field"><span class="lab">It describes the</span>${radios("level",LEVEL,E.level)}</div>
    <div class="field"><span class="lab">Seen or inferred?</span>${radios("basis",{observed:"Observed in the source",inferred:"My inference"},E.basis)}</div>
    <div class="field"><span class="lab">Still true today?</span>${radios("time",{current:"Current",historical:"Historical"},E.time)}</div>
    <label class="check"><input type="checkbox" name="verified" ${E.verified?"checked":""}><span>I've verified this in the field</span></label>
  </form>`;
  openSheet(existing?"Edit evidence":"Add evidence", body, `${existing?`<button class="btn danger" data-act="delev">Delete</button>`:""}<button class="btn primary" data-act="saveev">Save</button>`, {back:()=>openAccount(id)});
  const read = () => { const fd=new FormData($("#eform")); for(const k of ["claim","detail","dim","source","date","link","rel","level","basis","time"]) E[k]=(fd.get(k)||"").toString(); E.verified=fd.has("verified"); };
  UI.saveEv = async () => {
    read(); if(!E.claim.trim()){ toast("Write the finding first."); return; }
    if(E.link && !/^https?:\/\//i.test(E.link)) E.link = "https://"+E.link;
    E.claim=E.claim.trim();
    if(existing) Object.assign(existing, E); else n.evidence.push({...E, id:uid(), addedAt:new Date().toISOString()});
    try{ await Store.saveNote(id); }catch(e){ return; }
    openAccount(id);
  };
  UI.delEv = async () => { if(!(await ask("Delete this evidence?","It will be removed from this account."))) return; n.evidence = n.evidence.filter(e=>e.id!==evId); try{ await Store.saveNote(id); }catch(e){ return; } openAccount(id); };
}

/* ---- Account add/edit ---- */
function openAccountForm(id){
  const a = id ? {...S.accounts[id]} : {name:"",addr:"",city:"",zip:"",acct:"",phone:"",contact:"",bizType:"",device:"",list:"approved"};
  const body = () => `<form id="aform" class="stack" onsubmit="return false">
    ${FIELDS.map(f=>`<div class="field"><label for="f_${f.k}">${f.t}</label><input id="f_${f.k}" name="${f.k}" type="text" value="${esc(a[f.k]||"")}"></div>`).join("")}
    <div class="card small">${id&&a.origin!=="rep"?"This premise came from Brian's list. Its list status, approval and suppression can't be changed here.":"Stops you add yourself are marked as not on an approved list. Check eligibility through the official process before enrolling."}</div>
  </form>`;
  openSheet(id?"Edit account":"Add account", body, `${id?`<button class="btn danger" data-act="delacct">Delete</button>`:""}<button class="btn primary" data-act="saveacct">Save</button>`, {back: id?()=>openAccount(id):null});
  UI.saveAcct = async () => {
    const fd=new FormData($("#aform")); const b={}; FIELDS.forEach(f=>b[f.k]=(fd.get(f.k)||"").toString().trim());
    if(!id){ b.list="rep"; b.origin="rep"; }
    if(!b.name){ toast("Add a business name."); return; }
    if(S.demo) startReal();
    let key = id;
    if(id){ S.accounts[id] = {...S.accounts[id], ...b}; }
    else { b.id=accountId(b); b.importedAt=new Date().toISOString(); b.manual=true; if(S.accounts[b.id]){ toast("That account is already in your list."); openAccount(b.id); return; } S.accounts[b.id]=b; key=b.id; }
    try{ await Store.saveAccounts(); }catch(e){ return; }
    UI.sheet=null; openAccount(key);
  };
  UI.delAcct = async () => {
    if(!(await ask("Delete this account?","Its evidence and visit history go too. This can't be undone."))) return;
    delete S.accounts[id]; delete S.notes[id];
    try{ await Store.saveAccounts(); await Store.deleteNote(id); }catch(e){}
    UI.sheet=null; $("#sheet").hidden=true; render();
  };
}
function startReal(){ S = {accounts:{}, notes:{}, meta:{target:Number(S.meta.target)||200}, demo:false}; }

/* ---- Import ---- */
function openImport(){
  const I = {rows:null, map:{}, list:"approved", fileName:""};
  const body = () => {
    let h = `<div class="stack"><p class="small muted" style="margin:0">Use the CSV export of the list Brian sends. FieldMind matches accounts by account number, or by name and address when there's no number, so re-importing an updated list keeps your notes.</p>
      <div class="field"><label for="file">Choose a CSV list or a research file</label><input id="file" type="file" accept=".csv,.tsv,.txt,.json,text/csv,application/json"></div>
      <div class="field"><label for="paste">Or paste the rows, header included</label><textarea id="paste" placeholder="Business Name,Service Address,City,Zip,Account Number">${""}</textarea><button class="btn" data-act="parsepaste">Read pasted rows</button></div>`;
    if(I.rows){
      const headers=I.rows[0];
      h += `<div class="card stack"><h3>${esc(I.fileName||"Pasted rows")} · ${I.rows.length-1} rows</h3>
        <div class="field"><span class="lab">Which list is this?</span><div class="opts"><label class="opt"><input type="radio" name="ilist" value="approved" ${I.list==="approved"?"checked":""}><span>Approved list</span></label><label class="opt"><input type="radio" name="ilist" value="mimo" ${I.list==="mimo"?"checked":""}><span>MIMO list</span></label></div><span class="hint">On a MIMO list the device column describes the previous occupant's equipment.</span></div>
        <div class="field"><span class="lab">Match your columns</span><div class="mapgrid">${FIELDS.map(f=>`<label for="m_${f.k}">${f.t}</label><select id="m_${f.k}" data-map="${f.k}"><option value="-1">Not in this file</option>${headers.map((hd,i)=>`<option value="${i}" ${I.map[f.k]===i?"selected":""}>${esc(hd||"Column "+(i+1))}</option>`).join("")}</select>`).join("")}</div><span class="hint">Columns you don't match are kept under “Other columns”.</span></div>
        <div class="small muted">First row preview: ${esc((I.rows[1]||[]).slice(0,5).join(" · "))}</div></div>`;
    }
    return h+`</div>`;
  };
  openSheet("Import a list", body, `<button class="btn primary block" data-act="doimport" ${""}>Import</button>`, {onOpen(){ bind(); }});
  function bind(){
    const fi=$("#file"); if(fi) fi.onchange = async () => { const f=fi.files[0]; if(!f) return; const text=await f.text(); load(text, f.name); };
    document.querySelectorAll("[data-map]").forEach(s=>s.onchange=()=>{ I.map[s.dataset.map]=Number(s.value); });
    document.querySelectorAll("input[name=ilist]").forEach(r=>r.onchange=()=>{ I.list=r.value; });
  }
  function load(text, name){
    if(/^\s*\{/.test(text)){
      let obj=null; try{ obj=JSON.parse(text); }catch(e){}
      if(isResearch(obj)){ importResearch(obj); return; }
      toast("That file isn't a FieldMind research file or a CSV."); return;
    }
    const rows=parseCSV(text);
    if(rows.length<2){ toast("That file needs a header row and at least one account."); return; }
    I.rows=rows; I.fileName=name||""; I.map=guessMap(rows[0]);
    if(/mimo|move/i.test(name||"")) I.list="mimo";
    $("#sheetBody").innerHTML=body(); bind();
  }
  UI.parsePaste = () => load($("#paste").value, "");
  UI.doImport = async () => {
    if(!I.rows){ toast("Choose a file or paste rows first."); return; }
    if(I.map.name==null && I.map.addr==null){ toast("Match at least the business name or address column."); return; }
    const batch = "b"+Date.now().toString(36);
    const incoming = rowsToAccounts(I.rows, I.map, I.list, batch);
    if(!incoming.length){ toast("No rows had a name or address."); return; }
    if(S.demo) startReal();
    const r = mergeImport(S.accounts, incoming);
    S.accounts = r.accounts;
    S.meta.lastImport = {rows:r.rows, premises:r.premises, shared:r.shared, at:new Date().toISOString()};
    S.meta.batches = (S.meta.batches||[]).concat([{id:batch, at:S.meta.lastImport.at, file:I.fileName||"pasted rows", rows:r.rows, premises:r.premises, columns:(I.rows[0]||[]).length, list:I.list}]).slice(-20);
    try{ await Store.saveAccounts(); }catch(e){ return; }
    UI.sheet=null; $("#sheet").hidden=true; UI.filter="all"; setTab("search");
    toast(`${r.rows} records → ${r.premises} premises${r.shared?`, ${r.shared} listed under two names`:""}`);
  };
}

async function importResearch(obj){
  const v = validateResearch(obj);
  if(!v.ok){ showImportReport({errors:v.errors, warnings:v.warnings, fatal:true}); return; }
  if(S.demo){ toast("Import Brian's list first. Research only attaches to premises already on an approved list."); return; }
  const r = applyResearch(v, S.accounts, S.notes);
  try{ for(const p of v.premises){ const id=matchAccount(p.match, S.accounts); if(id) await Store.saveNote(id); } }catch(e){ return; }
  showImportReport({...r, errors:v.errors, warnings:v.warnings});
}
function showImportReport(r){
  openSheet("Research import", ()=>`<div class="stack">
    ${r.fatal?`<div class="banner warn"><div><b>Nothing was imported.</b></div></div>`:`<div class="tiles"><div class="tile"><div class="n">${r.matched}</div><div class="l">Premises matched</div></div><div class="tile"><div class="n">${r.evidence}</div><div class="l">Findings added</div></div></div>`}
    ${!r.fatal && r.unmatched && r.unmatched.length?`<div class="card small"><b>${r.unmatched.length} not on your list — not added.</b> Research can't add or approve prospects.<div class="muted">${esc(r.unmatched.slice(0,8).join(", "))}${r.unmatched.length>8?"…":""}</div></div>`:""}
    ${r.suppressed?`<div class="card small"><b>${r.suppressed} suppressed on Brian's list.</b> Research is stored, but they stay suppressed.</div>`:""}
    ${r.changed?`<div class="card small">${r.changed} premise${r.changed===1?"":"s"} changed since earlier research. History is kept.</div>`:""}
    ${(r.warnings||[]).map(w=>`<div class="card small">${esc(w)}</div>`).join("")}
    ${(r.errors||[]).length?`<details class="card small" ${r.fatal?"open":""}><summary>${r.errors.length} problem${r.errors.length===1?"":"s"} in the file</summary><ul>${r.errors.slice(0,50).map(e=>`<li>${esc(e)}</li>`).join("")}</ul></details>`:""}
  </div>`, `<button class="btn primary block" data-act="closereport">Done</button>`);
}

/* ---- Backup / export ---- */
function visitsCSV(){
  const cols=["date","time","business","address","city","zip","account","list","outcome","official_disposition","detail","gates_reached","minutes","participation","kw","install_date","notes"];
  const q = v => { const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const lines=[cols.join(",")];
  for(const v of allVisits()){ const a=S.accounts[v.accountId], d=new Date(v.at);
    lines.push([todayStr(d), `${pad(d.getHours())}:${pad(d.getMinutes())}`, a.name, a.addr, a.city, a.zip, a.acct, a.list, OUTCOMES[v.result]?.label, OUTCOMES[v.result]?.official, v.sub&&SUBS[v.result]?SUBS[v.result].opts[v.sub]:"", (v.gates||[]).join(" "), v.minutes, v.level||"", v.kw||"", v.install||"", v.notes].map(q).join(","));
  }
  return lines.join("\n");
}
async function exportCSV(){
  const csv=visitsCSV(), name=`fieldmind-visits-${todayStr()}.csv`;
  try{ const dl = window.claude && await window.claude.use("downloads"); if(dl){ await dl.save({filename:name, data:csv}); return; } }catch(e){ if(e && e.code && e.code!=="capability_disabled") { /* declined */ return; } }
  copyText(csv, "Visits copied as CSV. Paste into a spreadsheet.");
}
async function copyText(t, msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ openSheet("Copy this", ()=>`<textarea style="min-height:60vh" readonly>${esc(t)}</textarea>`, ""); } }
function openRestore(){
  openSheet("Restore backup", ()=>`<div class="stack"><p class="small muted" style="margin:0">Paste a backup copied from FieldMind. It replaces everything currently stored.</p><textarea id="rtext" style="min-height:40vh"></textarea></div>`, `<button class="btn primary block" data-act="dorestore">Replace my data</button>`);
}

/* ============ Dialogs ============ */
function ask(title, text){ return new Promise(res=>{ $("#modalTitle").textContent=title; $("#modalText").textContent=text||""; $("#modal").hidden=false; $("#modalYes").focus(); const done=v=>{ $("#modal").hidden=true; $("#modalYes").onclick=$("#modalNo").onclick=null; res(v); }; $("#modalYes").onclick=()=>done(true); $("#modalNo").onclick=()=>done(false); }); }
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 3200); }

/* ============ Events ============ */
document.addEventListener("click", async e => {
  const star = e.target.closest("[data-star]");
  if(star){ e.stopPropagation(); const id=star.dataset.star, n=note(id); n.today=!n.today; star.classList.toggle("on", n.today); star.innerHTML=starSvg(n.today); toast(n.today?"Saved for today":"Removed from saves"); Store.saveNote(id).catch(()=>{}); if(!UI.sheet) render(); return; }
  const open = e.target.closest("[data-open]"); if(open){ UI.briefTab="overview"; openAccount(open.dataset.open); return; }
  const cl = e.target.closest("[data-cluster]"); if(cl){ UI.openCluster = UI.openCluster===cl.dataset.cluster?null:cl.dataset.cluster; render(); return; }
  const md = e.target.closest("[data-mode]"); if(md){ UI.routeMode=md.dataset.mode; render(); return; }
  const bt = e.target.closest("[data-btab]"); if(bt){ UI.briefTab=bt.dataset.btab; UI.sheet&&UI.sheet.refresh(); return; }
  const sf = e.target.closest("[data-srcf]"); if(sf){ UI.srcFilter=sf.dataset.srcf; UI.sheet&&UI.sheet.refresh(); return; }
  const f = e.target.closest("[data-filter]"); if(f){ UI.filter=f.dataset.filter; render(); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act;
  if(act==="import") openImport();
  else if(act==="briefme") openBriefMe();
  else if(act==="sources") openSources(id);
  else if(act==="closereport"){ UI.sheet=null; $("#sheet").hidden=true; setTab("route"); }
  else if(act==="reveal"){ UI.reveal = UI.reveal===id?null:id; UI.sheet&&UI.sheet.refresh(); }
  else if(act==="reqnext"){ const ids=clusters(Object.keys(S.accounts)).flatMap(c=>c.ids).filter(i=>!S.notes[i]?.brief && !S.accounts[i].suppressed).slice(0,15); copyText(researchRequest(ids), `Copied ${ids.length} businesses. Paste to Claude.`); }
  else if(act==="add") openAccountForm(null);
  else if(act==="editacct") openAccountForm(id);
  else if(act==="visit") openVisit(id);
  else if(act==="evidence") openEvidence(id);
  else if(act==="editev") openEvidence(id, b.dataset.ev);
  else if(act==="dispute") openDispute(id, b.dataset.ev);
  else if(act==="savedispute"){ const t=($("#dnote").value||"").trim(); if(!t){ toast("Say what's actually true."); return; } const ev=note(id).evidence.find(x=>x.id===b.dataset.ev); if(ev){ ev.disputed={note:t, at:new Date().toISOString()}; ev.verified=false; try{ await Store.saveNote(id); }catch(e){ return; } } openSources(id); }
  else if(act==="undispute"){ const ev=note(id).evidence.find(x=>x.id===b.dataset.ev); if(ev){ delete ev.disputed; await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); } }
  else if(act==="verify"){ const ev=note(id).evidence.find(x=>x.id===b.dataset.ev); if(ev){ ev.verified=true; ev.verifiedAt=new Date().toISOString(); ev.time="current"; await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); } }
  else if(act==="clearret"){ note(id).ret=null; await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); }
  else if(act==="delvisit"){ if(await ask("Delete this visit?","Your stats will update.")){ const n=note(id); n.visits=n.visits.filter(v=>v.id!==b.dataset.v); await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); } }
  else if(act==="savevisit") UI.saveVisit();
  else if(act==="saveev") UI.saveEv();
  else if(act==="delev") UI.delEv();
  else if(act==="saveacct") UI.saveAcct();
  else if(act==="delacct") UI.delAcct();
  else if(act==="parsepaste") UI.parsePaste();
  else if(act==="doimport") UI.doImport();
  else if(act==="exportcsv") exportCSV();
  else if(act==="reqtoday"){ const ids=Object.keys(S.accounts).filter(i=>S.notes[i]?.today && !S.notes[i]?.brief); copyText(researchRequest(ids), "Copied. Paste it to Claude."); }
  else if(act==="reqfilter"){ const ids=[...document.querySelectorAll("#view [data-open]")].map(x=>x.dataset.open).filter(i=>!S.notes[i]?.brief).slice(0,25); if(!ids.length){ toast("Everything shown already has a brief."); return; } copyText(researchRequest(ids), `Copied ${ids.length} account${ids.length===1?"":"s"} without briefs. Paste to Claude.`); }
  else if(act==="backup") copyText(JSON.stringify({fieldmind:1, accounts:S.accounts, notes:S.notes, meta:S.meta}), "Backup copied. Paste it into a note or email to yourself.");
  else if(act==="restore") openRestore();
  else if(act==="dorestore"){
    let d; try{ d=JSON.parse($("#rtext").value); }catch(err){ toast("That isn't a FieldMind backup."); return; }
    if(!d || !d.accounts){ toast("That isn't a FieldMind backup."); return; }
    if(!(await ask("Replace all data?","Everything currently stored is replaced by the backup."))) return;
    const oldNotes = Object.keys(S.notes);
    S={accounts:d.accounts, notes:d.notes||{}, meta:{target:200, ...(d.meta||{}), chunks:S.meta.chunks||0}, demo:false};
    try{ await Store.saveAccounts(); if(Store.mode==="cloud"){ for(const k of oldNotes) if(!S.notes[k]) await Store.deleteNote(k); for(const k of Object.keys(S.notes)) await Store.saveNote(k); } }catch(err){ return; }
    UI.sheet=null; $("#sheet").hidden=true; render(); toast("Backup restored");
  }
  else if(act==="wipe"){
    if(!(await ask("Delete everything?","All accounts, evidence and visits are removed. Copy a backup first if you might want them."))) return;
    const ids=Object.keys(S.notes); S.accounts={};
    try{ await Store.saveAccounts(); if(Store.mode==="cloud") for(const k of ids) await Store.deleteNote(k); }catch(err){}
    S.notes={}; Store.saveLocal && Store.mode!=="cloud" && Store.saveLocal();
    loadDemo(); render(); toast("All data deleted");
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="q"){ UI.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener("change", async e => {
  if(e.target.id==="monthSel"){ UI.month=e.target.value; render(); }
  if(e.target.id==="tgt"){ const v=Number(e.target.value); if(v>0){ S.meta.target=v; await Store.saveMeta().catch(()=>{}); render(); } }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && !$("#modal").hidden){ $("#modalNo").click(); return; }
  if(e.key==="Escape" && UI.sheet){ closeSheet(); return; }
  if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-star]")){ e.preventDefault(); e.target.click(); }
});

/* ============ Boot ============ */
loadDemo();
render();
Store.init();
</script>
</body>
