<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=IBM+Plex+Mono:wght@500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, bottom tab bar, accounts open as full-screen sheets. */
/* Daylight-first (paper tone), dark at night. Signal Pink = brand + primary action. Citron = found/ready. */
:root{
  /* Typography tokens — not set by design system v1 below */
  --display:"Inter Display", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
.paper{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EEECE6; --ink:#171923; --muted:#5D6574; --line:#E4E2DC; --line-strong:#9AA0AB;
  --accent-text:#B3195C; --accent-soft:#FBE3EE;
  --good:#1B6B5A; --good-soft:#DDEFEA; --warn:#7A5410; --warn-soft:#F7E9CF; --bad:#9A3324; --bad-soft:#F6E1DC; --info:#454D5C; --info-soft:#E8EAEE;
  color:var(--ink); background:var(--bg); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:600;font-family:var(--body)}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Lock the app shell to the visible mobile viewport; only its content pane scrolls.
   Prevents iOS standalone/Safari page scroll restoration from shifting the entire UI down. */
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
.app{display:flex;flex-direction:column;position:fixed;inset:0;height:100%;height:100dvh;width:100%;max-width:640px;margin:0 auto;overflow:hidden}
.app > main{min-height:0;min-width:0;overscroll-behavior-y:contain}
.app > header,.app > nav{flex-shrink:0}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;}
header.top h1{font-size:22px;font-weight:800}
header.top .sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent-text);font-weight:600}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:13px;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px;font-weight:600}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.section-h h2{font-size:17px}
.section-h .muted{font-size:13px}

.banner{border-radius:var(--r);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.demo{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text);padding:6px 8px;min-height:36px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{background:none;border:0;padding:8px;cursor:pointer;color:var(--muted);border-radius:8px;display:inline-flex}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile .n{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted)}
.meter{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.meter > i{display:block;height:100%;background:var(--accent);border-radius:6px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:12px 10px 12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.stripe{width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.good{background:var(--good)} .stripe.accent{background:var(--accent)}
.group-h{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 2px 6px;display:flex;justify-content:space-between}

.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

/* Sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheet[hidden]{display:none}
.sheet header{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{flex:1;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px}
.sheet .foot .btn{flex:1}

.field{display:flex;flex-direction:column;gap:5px}
.field > label,.field > .lab{font-size:13px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:42px}
textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.opt input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:1px 0 0}

.ev{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);border-left-width:4px}
.ev.supports{border-left-color:var(--good)} .ev.contradicts{border-left-color:var(--bad)} .ev.mixed{border-left-color:var(--warn)} .ev.neutral,.ev.unknown{border-left-color:var(--line)}
.ev .claim{font-weight:600}
.ev .meta{font-size:13px;color:var(--muted);margin-top:6px}
.ev .act{display:flex;gap:4px;margin-top:6px}

.mimo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mimo > div{border-radius:10px;padding:10px;font-size:13px}
.mimo .hist{background:var(--line)}
.mimo .cur{background:var(--accent-soft)}
.mimo b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}

.gates{display:flex;flex-direction:column}
.gate{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.gate:first-child{border-top:0}
.gate .g{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.gate.done .g{background:var(--good);border-color:var(--good);color:var(--surface)}
.gate .when{margin-left:auto;font-size:13px;color:var(--muted)}

.timeline{display:flex;flex-direction:column;gap:8px}
.visit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13.5px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar .track i{display:block;height:100%;background:var(--accent)}
.bar .sub{font-size:13px;color:var(--muted);margin-top:4px}

.funnel .step{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13.5px;padding:6px 0}
.funnel .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.funnel .track i{display:block;height:100%;background:var(--info)}

.mapgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13.5px}
.mapgrid .col{font-family:var(--mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.modal{position:fixed;inset:0;background:rgba(20,10,15,.45);z-index:40;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:16px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90%}
.toast[hidden]{display:none}
.logo{width:30px;height:30px;flex:none}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brief .story{padding:14px;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.5}
.brief .story .when{font-size:13px;color:var(--muted);margin-top:6px}
.brief dl{margin:0;display:grid;grid-template-columns:1fr}
.brief .kv{padding:10px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:104px 1fr;gap:10px;font-size:14px}
.brief .kv:first-child{border-top:0}
.brief dt{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.brief dd{margin:0}
.brief ul{margin:0;padding-left:18px}
.brief .ask{background:var(--surface);padding:12px 14px;font-size:15px;font-weight:600;border-top:2px solid var(--accent)}
.brief .ask b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-text);margin-bottom:2px}
.dossier .row2{padding:10px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:104px 1fr;gap:10px;font-size:14px}
.dossier .row2:first-child{border-top:0}
.dossier .k{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.dossier .src{font-size:13px;color:var(--muted);margin-top:2px}
.dossier .st{display:inline-block;font-size:13px;font-weight:600;padding:1px 7px;border-radius:10px;margin-right:6px;vertical-align:1px}
.st.found{background:var(--good-soft);color:var(--good)} .st.not_found{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)} .st.not_checked{background:var(--line);color:var(--muted)} .st.conflict{background:var(--warn-soft);color:var(--warn)}
.h-sub{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:6px 2px 6px}
.dossier .src{font-family:var(--mono);font-size:13px}
.watch{margin:0;padding:12px 14px 12px 30px;font-size:14px;display:flex;flex-direction:column;gap:6px}
details.sources{border-top:1px solid var(--line);padding-top:12px}
details.sources>summary{display:flex;justify-content:space-between;font-weight:700;font-size:16px;cursor:pointer;list-style:none;padding:6px 2px}
details.sources>summary::-webkit-details-marker{display:none}
details.sources>summary::after{content:"Show";font-size:13px;color:var(--accent-text);font-weight:600}
details.sources[open]>summary::after{content:"Hide"}
details.card>summary{cursor:pointer;font-weight:600}
.cov{font-size:13px;color:var(--muted);padding:0 2px 4px}
.cov .nf{color:var(--warn)}

.route-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:6px 0 14px}
.route-h h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.route-h .sub{color:var(--muted);font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;line-height:1.3}
.chip.ok{background:var(--signal);color:#171923}
.chip.attn{background:var(--accent);color:#171923}
.chip.warn{background:var(--amber);color:#171923}
.chip.line{box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--ink)}
.chip.dim{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cl{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:16px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.cl.open{border-color:var(--accent)}
.cl-top{display:flex;gap:12px;align-items:flex-start}
.cl-top svg{width:24px;height:24px;flex:none;color:var(--accent);margin-top:2px}
.cl-name{font-size:19px;font-weight:700;line-height:1.2}
.cl-sub{color:var(--muted);font-size:14px}
.cl-list{margin:-6px 0 10px;border-radius:0 0 16px 16px;overflow:hidden}
.insight{background:#F6F5F1;color:#171923;border-radius:16px;padding:16px}
.insight h2{font-size:19px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.insight .nums{display:grid;grid-template-columns:repeat(3,1fr)}
.insight .nums>div{padding:0 10px;border-left:1px solid #DAD7CF}
.insight .nums>div:first-child{padding-left:0;border-left:0}
.insight .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.insight .l{font-size:13.5px;color:#454D5C}
nav.tabs{grid-template-columns:repeat(5,1fr)!important;align-items:end}
nav.tabs .center{display:flex;justify-content:center}
nav.tabs .center button{width:62px;height:62px;border-radius:50%;background:var(--accent);margin-top:-22px;display:grid;place-items:center;padding:0;color:#171923;box-shadow:0 4px 14px rgba(0,0,0,.35)}
nav.tabs .center button svg{width:34px;height:34px}
.hero .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hero h1{font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:6px 0 8px}
.hero .addr{color:var(--muted);font-size:14.5px}
.panel{margin:16px -16px -24px;padding:16px 16px 28px;border-radius:22px 22px 0 0;min-height:65vh;display:flex;flex-direction:column;gap:14px}
.fof{background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 5px 0 var(--accent)}
.fof .k{font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--accent-text);text-transform:uppercase}
.fof .q{font-size:17px;font-weight:700;line-height:1.3;margin-top:2px}
.fof.attn{border-color:#B94F3D;box-shadow:0 5px 0 #B94F3D}
.fof.attn .k{color:#B94F3D}
.fof.ok{border-color:#3D8B5E;box-shadow:0 5px 0 #3D8B5E}
.fof.ok .k{color:#3D8B5E}
.orows{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.orow{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.orow svg{width:22px;height:22px;color:var(--ink);margin-top:1px}
.orow .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15.5px}
.orow .d{font-size:14px;color:var(--muted);margin-top:2px}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dims>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.dims .dk{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dims .dv{font-size:13.5px;font-weight:700;line-height:1.3;margin-top:3px}
.srcs{display:flex;flex-direction:column;gap:10px}
.src-card{background:#F6F5F1;color:#171923;border-radius:14px;padding:14px;display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:10px}
.src-card svg.ic{width:24px;height:24px;color:#171923}
.src-card .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:15.5px}
.src-card .b{font-size:14px;margin-top:3px;color:#2B303A}
.src-card .m{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:5px}
.src-card .ext{color:var(--ink);display:inline-flex}
.src-card .acts{display:flex;gap:6px;margin-top:6px}
.src-card .acts button{background:none;border:0;color:var(--ink);font:600 13px var(--body);padding:4px 0;cursor:pointer;min-height:32px}
.src-card .chip.line{box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--ink)}
.src-card .chip.dim{background:var(--surface-2);color:var(--ink)}
.src-card.disputed .b{text-decoration:line-through}
.means{background:var(--bg);color:var(--ink);border-radius:14px;padding:14px;font-size:14.5px}
.means b{display:flex;gap:8px;align-items:center;font-size:16px;margin-bottom:4px}

/* ---- Legibility and decluttering (Nov 15) ---- */
.small{font-size:14px}

<script>
"use strict";
/* ============ Domain ============ */
const OUTCOMES = {
  optin:        {label:"Opt-in / enrolled", official:"Enrolled", tone:"good"},
  dm_absent:    {label:"Decision-maker absent", official:"Decision-maker absent", tone:"warn"},
  followup:     {label:"Follow-up / bad timing", official:"Bad timing / follow-up", tone:"info"},
  unqualified:  {label:"Unqualified location", official:"Unqualified location", tone:"bad"},
  not_interested:{label:"Not interested", official:"Not interested", tone:"bad"},
  other:        {label:"Other", official:"Other", tone:""}
};
const SUBS = {
  dm_absent: {q:"Who did you actually reach?", opts:{employee:"Employee only", manager:"Manager, not account holder", nobody:"Nobody available", closed_hours:"Closed at that hour"}},
  followup:  {q:"How firm is the return?", opts:{confirmed:"Confirmed appointment", window:"Told a specific window", vague:"Vague “come back sometime”", busy:"Decision-maker busy right now"}},
  unqualified:{q:"What was actually wrong?", opts:{perm_closed:"Permanently closed", vacant:"Vacant premises", wrong_suite:"Wrong suite / address mismatch", temp_closed:"Temporarily closed", restricted:"Restricted business type", no_central:"No central AC / heat pump", tstat:"Thermostat incompatible", wifi:"Wi-Fi not suitable", other:"Something else"}},
  not_interested:{q:"What was behind it?", opts:{incentive:"Incentive not worth it", comfort:"Comfort concerns", distrust:"Distrust of utility programs", landlord:"Landlord / corporate decides", no_reason:"No reason given", other:"Something else"}}
};
const RETURNABLE = new Set(["dm_absent","followup","temp_closed","wrong_suite","landlord","busy"]);
const GATES = [
  {k:"authorized", t:"Reached the authorized account holder"},
  {k:"interest", t:"Genuine interest established"},
  {k:"equipment", t:"Thermostat and cooling checked, with permission"},
  {k:"wifi", t:"Secure 2.4 GHz Wi-Fi and access confirmed"},
  {k:"enrolled", t:"Official enrollment and install appointment"}
];
const SOURCES = ["Public permit","Business listing","Business website","Customer review","Job posting","News / local media","GIS / property record","Observed on site","Told by staff","Told by owner","Other"];
const RELEVANCE = {supports:"Supports", contradicts:"Contradicts", mixed:"Mixed", neutral:"Neutral", unknown:"Unknown"};
const LEVEL = {business:"Business", premises:"Premises", equipment:"Equipment"};
const DIMS = {
  business:{t:"Business", d:"Operating model, ownership, history, changes"},
  people:{t:"People", d:"Who operates it and who decides"},
  infrastructure:{t:"Infrastructure", d:"Building, HVAC, permits, controls"},
  behavior:{t:"Participation", d:"Programs, investments, community involvement"},
  energy:{t:"Energy experience", d:"Outages, comfort, costs, energy projects"}
};
function researchLinks(a){
  const nm = a.name ? `"${a.name.replace(/^Example · /,"")}"` : "", place=[a.city, "NC"].filter(Boolean).join(" ");
  const g = q => "https://www.google.com/search?q="+encodeURIComponent(q);
  return {
    business: g(`${nm} ${place} opened OR "new ownership" OR relocated OR expansion`),
    people: g(`${nm} ${place} owner OR founder OR "general manager"`),
    infrastructure: g(`"${a.addr||""}" ${a.city||""} permit HVAC OR mechanical OR "rooftop unit"`),
    behavior: g(`${nm} ${place} chamber OR sponsor OR "energy efficiency" OR grant OR award`),
    energy: g(`${nm} ${place} reviews "AC" OR hot OR "power outage" OR "lost power"`)
  };
}
const ACCESS_TIMING = new Set(["dm_absent","followup"]);

/* ============ Utils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Imported links are untrusted even when HTML-escaped (including restored backups).
function safeHttpUrl(value){
  if(typeof value!=="string" || /[\u0000-\u0020\u007f]/.test(value)) return "";
  try{ const u=new URL(value); return (u.protocol==="https:" || u.protocol==="http:") && !u.username && !u.password ? u.href : ""; }catch(e){ return ""; }
}
function csvCell(value){
  let s=String(value??"");
  // Quoting alone does not prevent spreadsheet formula evaluation.
  if(/^[\s\uFEFF]*[=+@-]/.test(s) || /^[\t\r\n]/.test(s)) s="'"+s;
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
const pad = n => String(n).padStart(2,"0");
const todayStr = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey = s => s.slice(0,7);
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const fmtWhen = iso => { const d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()
  .replace(/\b(street)\b/g,"st").replace(/\b(avenue)\b/g,"ave").replace(/\b(road)\b/g,"rd").replace(/\b(drive)\b/g,"dr").replace(/\b(boulevard)\b/g,"blvd").replace(/\b(suite|ste|unit)\b/g,"ste");
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function accountId(a){ return a.acct ? "a-"+String(a.acct).replace(/[^A-Za-z0-9]/g,"").slice(0,60) : "n-"+hash(norm(a.name)+"|"+norm(a.addr)+"|"+norm(a.zip)); }

function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const first = text.split(/\r?\n/)[0] || "";
  const delim = (first.split("\t").length > first.split(",").length) ? "\t" : ",";
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(f); f=""; if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}
const FIELDS = [
  {k:"name", t:"Business name", re:/(business|dba|company|customer\s*name|premise\s*name|^name$|account\s*name)/i},
  {k:"addr", t:"Street address", re:/(service\s*addr|address|street|addr)/i},
  {k:"city", t:"City", re:/city|town/i},
  {k:"zip", t:"ZIP", re:/zip|postal/i},
  {k:"acct", t:"Account number", re:/(account\s*(no|num|#|id)|acct|premise\s*id|^account$)/i},
  {k:"phone", t:"Phone", re:/phone|tel/i},
  {k:"contact", t:"Contact name", re:/contact/i},
  {k:"device", t:"Device (previous occupant)", re:/device|thermostat|equipment/i},
  {k:"bizType", t:"Business type", re:/(type|category|naics|sic|segment)/i}
];
function guessMap(headers){
  const map={}, used=new Set();
  for(const f of FIELDS){
    const i = headers.findIndex((h,ix)=>!used.has(ix) && f.re.test(h));
    if(i>-1){ map[f.k]=i; used.add(i); }
  }
  return map;
}
function rowsToAccounts(rows, map, list, batch){
  const headers = rows[0], out=[];
  for(const r of rows.slice(1)){
    const a = {list};
    for(const f of FIELDS){ if(map[f.k]!=null && map[f.k]>-1) a[f.k] = (r[map[f.k]]||"").trim(); }
    if(!a.name && !a.addr) continue;
    const extra={}; headers.forEach((h,i)=>{ if(!Object.values(map).includes(i) && (r[i]||"").trim()) extra[h.trim().slice(0,40)] = r[i].trim().slice(0,200); });
    if(Object.keys(extra).length) a.extra = extra;
    a.id = accountId(a);
    const stCol = headers.findIndex(h=>/status/i.test(h));
    a.listStatus = stCol>-1 ? String(r[stCol]||"").trim() : "";
    a.sourceRows = [Object.assign(Object.fromEntries(headers.map((h,i)=>[String(h).trim()||("Column "+(i+1)), String(r[i]??"").trim()])), batch?{_batch:batch}:{})];
    out.push(a);
  }
  return out;
}
function mergeImport(existing, incoming){
  const res = {added:0, updated:0, dupInFile:0, rows:incoming.length, premises:0, shared:0}, seen=new Set(), next={...existing};
  const namesById={}; incoming.forEach(a=>{ (namesById[a.id]=namesById[a.id]||[]); if(a.name && !namesById[a.id].includes(a.name)) namesById[a.id].push(a.name); });
  res.premises = Object.keys(namesById).length;
  res.shared = Object.values(namesById).filter(n=>n.length>1).length + 0;
  const dupCount={}; incoming.forEach(a=>dupCount[a.id]=(dupCount[a.id]||0)+1);
  res.shared = Object.keys(dupCount).filter(k=>dupCount[k]>1).length;
  let ord = Math.max(0, ...Object.values(existing).map(x=>x.ord||0));
  const rowsById={}; incoming.forEach(a=>{ (rowsById[a.id]=rowsById[a.id]||[]).push(...(a.sourceRows||[])); });
  for(const a of incoming){
    if(seen.has(a.id)){ res.dupInFile++; continue; }
    a.sourceRows = rowsById[a.id];
    a.suppressed = a.sourceRows.some(r=>SUPPRESS_RE.test(pickCol(r,[/status/i, /suppress/i])));
    a.origin = "list";
    seen.add(a.id);
    const alts = (namesById[a.id]||[]).filter(n=>n!==a.name);
    if(alts.length) a.altNames = alts;
    if(!next[a.id]) a.ord = ++ord;
    if(next[a.id]){ next[a.id] = {...next[a.id], ...a, importedAt: next[a.id].importedAt}; res.updated++; }
    else { next[a.id] = {...a, importedAt: new Date().toISOString()}; res.added++; }
  }
  return {accounts:next, ...res};
}

/* ============ Domain model ============
   Stored: one record per premise (keyed by premise ID) holding the untouched source rows from each list import.
   Derived here, never stored: list records, utility account references (with first/last seen dates), historical
   devices, listed names, list membership, and the current occupant (only from research evidence). */
const SUPPRESS_RE = /suppress|do\s*not|dnc|reject|inelig|remove|hold|exclude/i;
function pickCol(r, res){ for(const re of res){ const k=Object.keys(r).find(k=>k!=="_batch" && re.test(k)); if(k) return r[k]; } return ""; }
function listRecords(a){
  return (a.sourceRows||[]).map((r,i)=>({ i, batch:r._batch||"", raw:r,
    company: pickCol(r,[/company|business|dba/i, /^name$/i]),
    account: pickCol(r,[/itron/i, /utility\s*account|account\s*(no|num|#|id)$/i]),
    device:  pickCol(r,[/device|thermostat/i]),

    let timer = setTimeout(()=>{ if(this.mode==="demo"&&!this.ready) this.useLocal("Couldn't reach cloud storage. Saving on this device."); }, 10000);
    try{
      const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      const user = db && window.claude.use ? await window.claude.use("user") : null;
      const id = user ? await user.id() : null;
      if(db && id){
        this.db=db; this.uid=id;
        const loaded = await this.loadCloud();
        clearTimeout(timer); this.ready=true; this.mode="cloud";
        this.setSync("ok","Synced");
        applyLoaded(loaded);
        Inbox.start();
        return;
      }
    }catch(e){ console.warn(e); }
    clearTimeout(timer); this.ready=true;
    this.useLocal("Saving on this device only.");
  },
  useLocal(msg){
    this.mode="local";
    let loaded=null; try{ loaded = JSON.parse(localStorage.getItem("fieldmind.v1")||"null"); }catch(e){}
    this.setSync("warn", "This device");
    this.localMsg = msg;
    applyLoaded(loaded);
  },
  ws(){ return this.db.doc("data/users/"+this.uid+"/workspace"); },
  async loadCloud(){
    const ws = this.ws();
    const [metaSnap, chunks, notes] = await Promise.all([ws.get(), ws.collection("chunks").get(), ws.collection("notes").get()]);
    if(!metaSnap.exists && chunks.empty) return null;
    const accounts={}; chunks.docs.forEach(d=>Object.assign(accounts, d.data().items||{}));
    const nts={}; notes.docs.forEach(d=>{ nts[d.id]=JSON.parse(JSON.stringify(d.data())); });
    return {accounts, notes:nts, meta:{target:200, ...(metaSnap.exists?metaSnap.data():{})}};
  },
  q(key, fn){ const p=(this.queues[key]||Promise.resolve()).then(fn,fn); this.queues[key]=p.catch(()=>{}); return p; },
  async write(key, fn){
    try{ await this.q(key, fn); }
    catch(e){ console.warn(e); this.setSync("warn","Not saved"); toast(e && e.code==="quota_exceeded" ? "Storage is full. Delete old accounts and try again." : "Couldn't save that change. Check your connection and try again."); throw e; }
  },
  saveLocal(){ try{ localStorage.setItem("fieldmind.v1", JSON.stringify({accounts:S.accounts, notes:S.notes, meta:S.meta})); }catch(e){ toast("This browser won't keep data. Use Copy backup in More."); } },
  async saveAccounts(){
    if(S.demo) return;
    if(this.mode!=="cloud") return this.saveLocal();
    const ws=this.ws(), ids=Object.keys(S.accounts), CH=60, n=Math.ceil(ids.length/CH), old=S.meta.chunks||0;
    this.setSync("","Saving");
    for(let i=0;i<n;i++){ const items={}; ids.slice(i*CH,(i+1)*CH).forEach(id=>items[id]=S.accounts[id]); await this.write("c"+i, ()=>ws.collection("chunks").doc("c"+i).set({items})); }
    for(let i=n;i<old;i++) await this.write("c"+i, ()=>ws.collection("chunks").doc("c"+i).delete());
    S.meta.chunks=n; await this.saveMeta();
  },
  async saveNote(id){
    if(S.demo) return;
    if(this.mode!=="cloud") return this.saveLocal();
    this.setSync("","Saving");
    const body = JSON.parse(JSON.stringify(S.notes[id]||{}));
    await this.write("n:"+id, ()=>this.ws().collection("notes").doc(id).set(body));
    this.setSync("ok","Synced");
  },
  async deleteNote(id){ if(this.mode==="cloud") await this.write("n:"+id, ()=>this.ws().collection("notes").doc(id).delete()); else this.saveLocal(); },
  async saveMeta(){
    if(S.demo) return;
    if(this.mode!=="cloud") return this.saveLocal();
    await this.write("meta", ()=>this.ws().set(JSON.parse(JSON.stringify(S.meta))));
    this.setSync("ok","Synced");
  }
};
function applyLoaded(loaded){

}

const CLAUDE_RUN_URL = "https://claude.ai/new?q=" + encodeURIComponent("Run my FieldMind research");
const Inbox = {
  items:[], queued:[], sub:null, timer:null,
  on(){ return Store.mode==="cloud" && !!Store.db; },
  col(){ return Store.db.collection("research"); },
  take(docs){
    const items=[], queued=[];
    docs.forEach(d=>{ const x=d.data()||{}; if(d.id==="queue") queued.push(...(Array.isArray(x.items)?x.items:[])); else if(/^result_[a-z0-9]{2,12}$/.test(d.id) && x.research && typeof x.research==="object"){ let r=x.research; try{ if(r.fieldmind_research===1 && Array.isArray(r.accounts)) r=convertV1(r); }catch(e){ return; } if(Array.isArray(r.premises)) items.push({id:d.id, ref:String(x.ref||""), at:x.at, research:r}); } });
    this.items=items.slice(0,200); this.queued=queued.slice(0,500); render(); if(UI.sheet && UI.sheet.inbox) UI.sheet.refresh();
  },
  start(){
    if(!this.on() || this.sub || this.timer) return;
    try{ const c=this.col(); if(typeof c.onSnapshot==="function"){ this.sub=c.onSnapshot(snap=>this.take(snap.docs||[]), e=>console.warn(e)); return; } }catch(e){ console.warn(e); }
    const poll=async()=>{ try{ const snap=await this.col().get(); this.take(snap.docs||[]); }catch(e){ console.warn(e); } };
    poll(); this.timer=setInterval(()=>{ if(document.visibilityState==="visible") poll(); }, 30000);
  },
  async queue(ids){
    const add = ids.filter(id=>S.accounts[id] && !S.accounts[id].suppressed).map(id=>{ const a=S.accounts[id]; return {ref:refOf(id), name:a.name||"", addr:a.addr||"", city:a.city||"", zip:a.zip||""}; });
    const byRef = new Map(this.queued.map(x=>[x.ref,x])); add.forEach(x=>byRef.set(x.ref,x));
    const items=[...byRef.values()].slice(0,200);
    await Store.write("rq", ()=>this.col().doc("queue").set({items, updatedAt:new Date().toISOString()}));
    this.queued=items; return add.length;
  },
  async clear(done, refs){
    for(const it of done) await Store.write("rr:"+it.id, ()=>this.col().doc(it.id).delete());
    const left=this.queued.filter(x=>!refs.has(x.ref));
    await Store.write("rq", ()=>this.col().doc("queue").set({items:left, updatedAt:new Date().toISOString()}));
    this.items=this.items.filter(x=>!done.includes(x)); this.queued=left; render();
  },
  async accept(){
    const done=this.items.slice(); if(!done.length) return;
    const premises=[]; done.forEach(it=>{ const r=it.research; if(r && Array.isArray(r.premises)) premises.push(...r.premises.slice(0,5)); });
    const obj={schema:"fieldmind.research", version:2, generated:new Date().toISOString(), premises};
    const refs=new Set(premises.map(p=>p?.match?.ref).filter(Boolean));
    await importResearch(obj);
    try{ await this.clear(done, refs); }catch(e){}
  }
};

/* ============ Approach line — who to ask for ============
   Derives a specific pre-visit script line from business-name signals,
   suite presence, decision route, thermostat estimate, and known occupant name.
   Returns {line, context} or null when not enough signal is available. */
function approachLine(id){
  const a=S.accounts[id]; if(!a) return null;
  const b=S.notes[id]?.brief;
  const d=b?.decision||{}, occ=b?.occupant, name=occ?.name||"";
  const bizName=String(a.name||"").toUpperCase();
  const addr=String(a.addr||"");

  // 1. Detect large-facility signals from the business name
  const isMfg    = /manufactur|processing|warehouse|distribution|industrial|plant|factory|logistics|freight/i.test(bizName);
  const isChain  = /\b(LLC|INC|CORP|CO\.|LTD|GROUP|NATIONAL|ENTERPRISES?|HOLDINGS?)\b/i.test(bizName) && !/BARBER|SALON|SPA|STUDIO|SHOP|NAIL/i.test(bizName);
  const isLargeOffice = /MEDICAL|DENTAL|LAW|HEALTH|CLINIC|CENTER|HOSPITAL|URGENT|GOVERNMENT|COUNTY|MUNICIPAL|UNIVERSITY|COLLEGE|SCHOOL|ACADEMY/i.test(bizName);
  const isHotel  = /HOTEL|INN|SUITES|LODGE|MOTEL|MARRIOTT|HILTON|HAMPTON|HOLIDAY/i.test(bizName);
  const isRetail = /STORE|MARKET|GROCERY|FOOD|PIZZA|RESTAURANT|CAFE|COFFEE|DELI|BAR\b|GRILL|BUFFET|WING|TACO|NAIL|BARBER|SALON|SPA|LAUNDRY/i.test(bizName);

  // 2. Detect large-footprint address signals (suite/unit implies shared building with management)
  const hasSuite = /\b(ste|suite|unit|fl|floor|bldg|building)\b/i.test(addr);
  const hasTherm = b?.thermostats?.low >= 3; // 3+ thermostats = not a small single-occupant space

  // 3. Decide approach context
  // A. Known occupant from research — use their name
  if(name && occ && (occ.status==="verified"||occ.status==="found")){
    const firstName = name.trim().split(/\s+/)[0];
    return {
      line: `Ask for ${esc(firstName)} or whoever handles the Duke Energy account.`,
      context: "Known occupant"
    };
  }

  // B. Known decision route with a named person or title
  if(d.who){
    return {
      line: `Ask for ${esc(d.who)}.`,
      context: ROUTES[d.route]||"Decision route on file"
    };
  }

  // C. Manufacturing / warehouse / industrial — multi-meter environment
  if(isMfg || (hasTherm && (isChain||isLargeOffice))){
    return {
      line: "Ask for the facilities manager or whoever oversees building utilities.",
      context: isMfg ? "Manufacturing or industrial — multi-meter site" : "Large facility with multiple thermostats"
    };
  }

  // D. Hotel / large hospitality — engineering or facilities
  if(isHotel){
    return {
      line: "Ask for the facilities or engineering manager.",
      context: "Hotel or hospitality property"
    };
  }

  // E. Medical, dental, clinic, government building — office manager or administrator
  if(isLargeOffice || hasSuite){
    return {
      line: "Ask for the office manager or whoever handles the utility bill.",
      context: isLargeOffice ? "Professional or institutional building" : "Suite in a shared building"
    };
  }

  // F. Retail / food service — single-location, likely local owner or manager on duty
  if(isRetail){
    return {
      line: "Ask for the owner or manager and ask who handles the Duke Energy account.",
      context: "Retail or food service"
    };
  }

  // G. Generic small business fallback — avoid "the owner" per rep feedback
  return {
    line: "Ask for whoever handles the electricity or Duke Energy account.",
    context: "Small business — decision-maker not yet established"
  };
}

}

const EV_CLASS = {verified:["ok","✓ Verified"], found:["ok","Found"], inferred:["line","Inferred"], historical:["dim","Historical"], conflicting:["attn","Conflicting"], unknown:["line","Unknown"]};
function evClass(e){ if(e.disputed) return "conflicting"; if(e.verified) return "verified"; if(e.status && EV_CLASS[e.status]) return e.status; if(e.rel==="contradicts" || e.rel==="mixed") return "conflicting"; if(e.verified) return "verified"; if(e.basis==="inferred") return "inferred"; if(e.time==="historical") return "historical"; return "found"; }
const SRC_CAT = {business:"Business", infrastructure:"Property", people:"People", energy:"Energy", behavior:"Energy"};
function srcIcon(e){ const s=(e.source||"").toLowerCase(); if(/permit|gis|property|flyer/.test(s)) return IC.building; if(/website|other/.test(s)) return IC.globe; if(/listing|review|google|booksy/.test(s)) return IC.store; if(/staff|owner/.test(s)) return IC.person; return IC.doc; }

async function importResearch(obj){
  const v = validateResearch(obj);
  if(!v.ok){ showImportReport({errors:v.errors, warnings:v.warnings, fatal:true}); return; }
  if(S.demo){ toast("Import your list first. Research only attaches to businesses already on your list."); return; }
  const r = applyResearch(v, S.accounts, S.notes);
  try{ for(const p of v.premises){ const id=matchAccount(p.match, S.accounts); if(id) await Store.saveNote(id); } }catch(e){ return; }
  showImportReport({...r, errors:v.errors, warnings:v.warnings});
}
function showImportReport(r){
  openSheet("Research import", ()=>`<div class="stack">
    ${r.fatal?`<div class="banner warn"><div><b>Nothing was imported.</b></div></div>`:`<div class="tiles"><div class="tile"><div class="n">${r.matched}</div><div class="l">Premises matched</div></div><div class="tile"><div class="n">${r.evidence}</div><div class="l">Findings added</div></div></div>`}
    ${!r.fatal && r.unmatched && r.unmatched.length?`<div class="card small"><b>${r.unmatched.length} not on your list — not added.</b> Research can't add or approve prospects.<div class="muted">${esc(r.unmatched.filter(x=>!/^r[0-9a-z]{4,9}$/.test(x)).slice(0,8).join(", "))}${r.unmatched.length>8?"…":""}</div></div>`:""}
    ${r.suppressed?`<div class="card small"><b>${r.suppressed} suppressed on your list.</b> Research is stored, but they stay suppressed.</div>`:""}
    ${r.changed?`<div class="card small">${r.changed} premise${r.changed===1?"":"s"} changed since earlier research. History is kept.</div>`:""}
    ${(r.warnings||[]).map(w=>`<div class="card small">${esc(w)}</div>`).join("")}
    ${(r.errors||[]).length?`<details class="card small" ${r.fatal?"open":""}><summary>${r.errors.length} problem${r.errors.length===1?"":"s"} in the file (details for whoever made it)</summary><ul>${r.errors.slice(0,50).map(e=>`<li>${esc(e)}</li>`).join("")}</ul></details>`:""}
  </div>`, `<button class="btn primary block" data-act="closereport">Done</button>`);
}

  const lines=[cols.join(",")];
  for(const v of allVisits()){ const a=S.accounts[v.accountId], d=new Date(v.at);
    lines.push([todayStr(d), `${pad(d.getHours())}:${pad(d.getMinutes())}`, a.name, a.addr, a.city, a.zip, a.acct, a.list, OUTCOMES[v.result]?.label, OUTCOMES[v.result]?.official, v.sub&&SUBS[v.result]?SUBS[v.result].opts[v.sub]:"", (v.gates||[]).join(" "), v.minutes, v.level||"", v.kw||"", v.install||"", v.notes].map(q).join(","));
  }
  return lines.join("\n");
}
async function exportCSV(){
  const csv=visitsCSV(), name=`fieldmind-visits-${todayStr()}.csv`;
  try{ const dl = window.claude && await window.claude.use("downloads"); if(dl){ await dl.save({filename:name, data:csv}); return; } }catch(e){ if(e && e.code && e.code!=="capability_disabled") { /* declined */ return; } }
  copyText(csv, "Visits copied as CSV. Paste into a spreadsheet.");
}
async function copyText(t, msg){ try{ await navigator.clipboard.writeText(t); toast(msg); }catch(e){ openSheet("Copy this", ()=>`<textarea style="min-height:60vh" readonly>${esc(t)}</textarea>`, ""); } }
function openRestore(){
  openSheet("Restore backup", ()=>`<div class="stack"><p class="small muted" style="margin:0">Paste a backup copied from FieldMind. It replaces everything currently stored.</p><textarea id="rtext" style="min-height:40vh"></textarea></div>`, `<button class="btn primary block" data-act="dorestore">Replace my data</button>`);
}

/* ============ Dialogs ============ */
function ask(title, text){ return new Promise(res=>{ $("#modalTitle").textContent=title; $("#modalText").textContent=text||""; $("#modal").hidden=false; $("#modalYes").focus(); const done=v=>{ $("#modal").hidden=true; $("#modalYes").onclick=$("#modalNo").onclick=null; res(v); }; $("#modalYes").onclick=()=>done(true); $("#modalNo").onclick=()=>done(false); }); }
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 3200); }

/* ============ Events ============ */
document.addEventListener("click", async e => {
  const star = e.target.closest("[data-star]");
  if(star){ e.stopPropagation(); const id=star.dataset.star, n=note(id); n.today=!n.today; star.classList.toggle("on", n.today); star.innerHTML=starSvg(n.today); toast(n.today?"Saved for today":"Removed from saves"); Store.saveNote(id).catch(()=>{}); if(!UI.sheet) render(); return; }
  const open = e.target.closest("[data-open]"); if(open){ UI.briefTab="overview"; openAccount(open.dataset.open); return; }
  const cl = e.target.closest("[data-cluster]"); if(cl){ UI.openCluster = UI.openCluster===cl.dataset.cluster?null:cl.dataset.cluster; render(); return; }
  const md = e.target.closest("[data-mode]"); if(md){ UI.routeMode=md.dataset.mode; render(); return; }
  const bt = e.target.closest("[data-btab]"); if(bt){ UI.briefTab=bt.dataset.btab; UI.sheet&&UI.sheet.refresh(); return; }
  const sf = e.target.closest("[data-srcf]"); if(sf){ UI.srcFilter=sf.dataset.srcf; UI.sheet&&UI.sheet.refresh(); return; }
  const f = e.target.closest("[data-filter]"); if(f){ UI.filter=f.dataset.filter; render(); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id, act=b.dataset.act;
  if(act==="import") openImport();
  else if(act==="briefme") openBriefMe();
  else if(act==="reviewinbox") openInbox();
  else if(act==="acceptinbox") Inbox.accept();
  else if(act==="queuenext" || act==="queuesaved"){
    const ids=clusters(Object.keys(S.accounts)).flatMap(c=>c.ids).filter(id=>!S.notes[id]?.brief && !S.accounts[id].suppressed);
    const qset=new Set(Inbox.queued.map(x=>x.ref));
    const pick = act==="queuesaved" ? ids.filter(id=>S.notes[id]?.today && !qset.has(refOf(id))) : ids.filter(id=>!qset.has(refOf(id))).slice(0,15);
    try{ const n=await Inbox.queue(pick); toast(`${n} stop${n===1?"":"s"} queued. Open Claude to run ${n===1?"it":"them"}.`); if(UI.sheet) UI.sheet.refresh(); }catch(e){}
  }
  else if(act==="sources") openSources(id);
  else if(act==="closereport"){ UI.sheet=null; $("#sheet").hidden=true; setTab("route"); }
  else if(act==="reveal"){ UI.reveal = UI.reveal===id?null:id; UI.sheet&&UI.sheet.refresh(); }
  else if(act==="liveresearch") openLiveResearch(b.dataset.id);
  else if(act==="beginresearch") beginLiveResearch();
  else if(act==="retryresearch"){ UI.liveResearch.state="ready"; UI.liveResearch.error=""; refreshLiveResearch(); }
  else if(act==="attachresearch") attachLiveResearch();
  else if(act==="discardresearch"){ const id=UI.liveResearch.id; UI.liveResearch=null; openAccount(id); }
  else if(act==="reqnext"){ const ids=clusters(Object.keys(S.accounts)).flatMap(c=>c.ids).filter(i=>!S.notes[i]?.brief && !S.accounts[i].suppressed).slice(0,15); copyText(researchRequest(ids), `Copied ${ids.length} businesses. Paste to Claude.`); }
  else if(act==="add") openAccountForm(null);
  else if(act==="editacct") openAccountForm(id);
  else if(act==="visit") openVisit(id);
  else if(act==="evidence") openEvidence(id);
  else if(act==="editev") openEvidence(id, b.dataset.ev);
  else if(act==="dispute") openDispute(id, b.dataset.ev);
  else if(act==="savedispute"){ const t=($("#dnote").value||"").trim(); if(!t){ toast("Say what's actually true."); return; } const ev=note(id).evidence.find(x=>x.id===b.dataset.ev); if(ev){ ev.disputed={note:t, at:new Date().toISOString()}; ev.verified=false; try{ await Store.saveNote(id); }catch(e){ return; } } openSources(id); }
  else if(act==="undispute"){ const ev=note(id).evidence.find(x=>x.id===b.dataset.ev); if(ev){ delete ev.disputed; await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); } }
  else if(act==="verify"){ const ev=note(id).evidence.find(x=>x.id===b.dataset.ev); if(ev){ ev.verified=true; ev.verifiedAt=new Date().toISOString(); ev.time="current"; await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); } }
  else if(act==="copyaddr"){ const a=S.accounts[id]; if(a) copyText([a.addr,a.city,a.zip].filter(Boolean).join(", "), "Address copied"); }
  else if(act==="clearret"){ note(id).ret=null; await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); }
  else if(act==="delvisit"){ if(await ask("Delete this visit?","Your stats will update.")){ const n=note(id); n.visits=n.visits.filter(v=>v.id!==b.dataset.v); await Store.saveNote(id).catch(()=>{}); UI.sheet.refresh(); } }
  else if(act==="savevisit") UI.saveVisit();
  else if(act==="saveev") UI.saveEv();
  else if(act==="delev") UI.delEv();
  else if(act==="saveacct") UI.saveAcct();
  else if(act==="delacct") UI.delAcct();
  else if(act==="parsepaste") UI.parsePaste();
  else if(act==="doimport") UI.doImport();
  else if(act==="exportcsv") exportCSV();
  else if(act==="reqtoday"){ const ids=Object.keys(S.accounts).filter(i=>S.notes[i]?.today && !S.notes[i]?.brief); copyText(researchRequest(ids), "Copied. Paste it to Claude."); }
  else if(act==="reqfilter"){ const ids=[...document.querySelectorAll("#view [data-open]")].map(x=>x.dataset.open).filter(i=>!S.notes[i]?.brief).slice(0,25); if(!ids.length){ toast("Everything shown already has a brief."); return; } copyText(researchRequest(ids), `Copied ${ids.length} account${ids.length===1?"":"s"} without briefs. Paste to Claude.`); }
  else if(act==="backup") copyText(JSON.stringify({fieldmind:1, accounts:S.accounts, notes:S.notes, meta:S.meta}), "Backup copied. Paste it into a note or email to yourself.");
  else if(act==="restore") openRestore();
  else if(act==="dorestore"){
    let d; try{ d=JSON.parse($("#rtext").value); }catch(err){ toast("That isn't a FieldMind backup."); return; }
    if(!d || !d.accounts){ toast("That isn't a FieldMind backup."); return; }
    if(!(await ask("Replace all data?","Everything currently stored is replaced by the backup."))) return;
    const oldNotes = Object.keys(S.notes);
    S={accounts:d.accounts, notes:d.notes||{}, meta:{target:200, ...(d.meta||{}), chunks:S.meta.chunks||0}, demo:false};
    try{ await Store.saveAccounts(); if(Store.mode==="cloud"){ for(const k of oldNotes) if(!S.notes[k]) await Store.deleteNote(k); for(const k of Object.keys(S.notes)) await Store.saveNote(k); } }catch(err){ return; }
    UI.sheet=null; $("#sheet").hidden=true; render(); toast("Backup restored");
  }
  else if(act==="wipe"){
    if(!(await ask("Delete everything?","All accounts, evidence and visits are removed. Copy a backup first if you might want them."))) return;
    const ids=Object.keys(S.notes); S.accounts={};
    try{ await Store.saveAccounts(); if(Store.mode==="cloud") for(const k of ids) await Store.deleteNote(k); }catch(err){}
    S.notes={}; Store.saveLocal && Store.mode!=="cloud" && Store.saveLocal();
    loadDemo(); render(); toast("All data deleted");
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="q"){ UI.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener("change", async e => {
  if(e.target.id==="monthSel"){ UI.month=e.target.value; render(); }
  if(e.target.id==="tgt"){ const v=Number(e.target.value); if(v>0){ S.meta.target=v; await Store.saveMeta().catch(()=>{}); render(); } }

document.addEventListener("keydown", e => {
  if(e.key==="Escape" && !$("#modal").hidden){ $("#modalNo").click(); return; }

});

/* ============ Local public-source research ============ */
function researchSnapshot(a){ return JSON.stringify([a.name,a.addr,a.city,a.zip,a.list,!!a.suppressed]); }
function openLiveResearch(id){
  const a=S.accounts[id]; if(!a) return;
  if(a.suppressed){ toast("Suppressed records cannot start research."); return; }
  const _rd=readiness(id); if(_rd.k==="locked_out"){ toast("Account is not yet eligible. Confirm eligibility with the call center before researching."); return; }
  if(!a.name || !a.addr || !a.city){ toast("Add a business name, street address and city first."); return; }
  if(UI.liveResearch && UI.liveResearch.id!==id && ["running","complete"].includes(UI.liveResearch.state)){
    toast("Finish or discard the current research draft first."); showLiveResearch(); return;
  }
  if(!UI.liveResearch || UI.liveResearch.id!==id) UI.liveResearch={id,state:"ready"};
  showLiveResearch();
}
function liveResearchBody(){
  const r=UI.liveResearch, a=S.accounts[r.id];
  let h=`<div class="stack"><div><b>${esc(nice(a?.name)||"Business removed")}</b><div class="small muted">${esc([nice(a?.addr),nice(a?.city)].filter(Boolean).join(", "))}</div></div><p class="small">Searches public sources using only the business name and address. Account numbers and history stay private.</p>`;
  const localService = location.protocol==="http:" && location.hostname==="127.0.0.1";
  if(r.state==="ready" && !localService) h+=`<div class="banner"><div><b>Automatic research runs in FieldMind on your computer.</b></div></div><p class="small">On this device, tap the center button to copy a research request, then import the results. They show up here the same way.</p>`;
  else if(r.state==="ready") h+=`<p class="small muted">Findings come from public sources and still need checking on site. Nothing is saved until you review it.</p><button class="btn primary block" data-act="beginresearch">Start public research</button>`;
  if(r.state==="running") h+=`<div class="banner"><div role="status">Researching public sources… ${Math.round((Date.now()-r.started)/1000)} seconds. You can close this panel and reopen it.</div></div>`;
  if(r.error) h+=`<div class="banner warn" role="alert"><div>${esc(r.error)}</div></div>`;
  if(r.state==="failed") h+=`<button class="btn block" data-act="retryresearch">Try again</button><p class="small muted">Automatic research needs FieldMind running on your computer.</p>`;
  if(r.state==="complete"){
    const p=r.result.draft.premises[0],m=r.result.metrics;
    h+=`<div class="small muted">Checked ${Number(m.usable_pages)} page${Number(m.usable_pages)===1?"":"s"} in ${Math.round(Number(m.elapsed_seconds))} seconds · ${p.claims.length} finding${p.claims.length===1?"":"s"}</div><p class="small"><b>Check on site before relying on this.</b> Who operates here, who signs for the account, equipment and eligibility aren't confirmed.</p>`;
    h+=(p.research_questions||[]).map(q=>`<div class="card small"><b>${esc(q.question)}</b><div>${esc(q.answer)}</div></div>`).join("");
    h+=p.claims.map(c=>`<div class="card small"><b>${c.status==="historical"?"Older information":"Found in a public source"}</b><div>${esc(c.excerpt)}</div><div class="muted">Checked ${esc(fmtDate(todayStr(new Date(c.retrieved_at))))}</div>${safeHttpUrl(c.source.url)?`<a href="${esc(safeHttpUrl(c.source.url))}" target="_blank" rel="noopener noreferrer">Open source</a>`:""}</div>`).join("");
    if(!p.claims.length) h+=`<p class="small">Nothing found in public sources. That doesn't mean there's nothing to find.</p>`;
    if(r.result.failures.length || r.result.search_failures.length) h+=`<div class="card small"><b>Couldn't check</b>${r.result.failures.map(f=>`<div>${esc(f.url)}: ${esc(f.status||f.reason)}</div>`).join("")}${r.result.search_failures.map(f=>`<div>${esc(f.error||f.engines.map(e=>e.join(": ")).join("; "))}</div>`).join("")}</div>`;
    h+=`<button class="btn primary block" data-act="attachresearch">Save to this business</button><p class="small muted">Saving adds these findings to this business. It doesn't confirm who operates here or who decides, and it doesn't change your list.</p>`;
  }
  if(r.state!=="running") h+=`<button class="btn block" data-act="discardresearch">Discard this draft</button>`;
  return h+"</div>";
}
function showLiveResearch(){ openSheet("Public-source research",liveResearchBody,"",{researchId:UI.liveResearch.id,back:()=>openAccount(UI.liveResearch.id)}); }
function refreshLiveResearch(){ if(UI.sheet?.researchId===UI.liveResearch?.id) UI.sheet.refresh(); }
async function researchFetch(path,opts={}){
  if(location.protocol!=="http:" || location.hostname!=="127.0.0.1") throw Error("Automatic research only works in FieldMind on your computer.");
  const response=await fetch(path,{...opts,headers:{"X-FieldMind-Local":"1",...(opts.body?{"Content-Type":"application/json"}:{})},credentials:"same-origin",signal:AbortSignal.timeout(15000)});
  const data=await response.json(); if(!response.ok) throw Error(data.error||"Research isn't available right now."); return data;
}
async function beginLiveResearch(){
  const r=UI.liveResearch;if(!r || r.state==="running")return;const a=S.accounts[r.id];
  if(!a || a.suppressed){ toast("Record removed or suppressed. Research was not started.");return; }
  r.state="running";r.error="";r.started=Date.now();r.snapshot=researchSnapshot(a);r.notesSnapshot=JSON.stringify(S.notes[r.id]||null);r.ref=crypto.randomUUID().replaceAll("-","");refreshLiveResearch();
  try{
    const job=await researchFetch("/api/research",{method:"POST",body:JSON.stringify({name:a.name,addr:a.addr,city:a.city,ref:r.ref})});r.job=job.job_id;
    while(Date.now()-r.started<210000){
      const result=await researchFetch("/api/research/"+encodeURIComponent(r.job));
      if(result.state==="failed")throw Error(result.error);
      if(result.state==="complete"){r.result=result;r.state="complete";refreshLiveResearch();return;}
      await new Promise(resolve=>setTimeout(resolve,1500));refreshLiveResearch();
    }
    throw Error("Timed out waiting for research. Nothing was saved.");
  }catch(error){r.error=error.message;r.state="failed";refreshLiveResearch();}
}
async function attachLiveResearch(){
  const r=UI.liveResearch;if(!r || r.state!=="complete" || r.saving)return;const a=S.accounts[r.id];
  if(!a || a.suppressed || researchSnapshot(a)!==r.snapshot || JSON.stringify(S.notes[r.id]||null)!==r.notesSnapshot){r.error="This record changed during research. Nothing was saved. Review the record and start again.";refreshLiveResearch();return;}
  const obj=JSON.parse(JSON.stringify(r.result.draft)),p=obj.premises?.[0];
  if(obj.premises?.length!==1 || p?.match?.ref!==r.ref || p.occupant?.status!=="unknown" || p.decision_route?.route!=="unknown" || Object.values(p.profile||{}).some(f=>f.status!=="not_checked") || p.claims.some(c=>!["found","historical"].includes(c.status)||c.current_verified!==false||!safeHttpUrl(c.source?.url))){r.error="This result didn't pass FieldMind's checks, so nothing was saved.";refreshLiveResearch();return;}
  const previous=S.notes[r.id]?JSON.parse(JSON.stringify(S.notes[r.id])):null,old=previous?.brief;
  // Keep prior adjudicated information; this job supplies only qualified leads.
  if(old){p.occupant=old.occupant||p.occupant;p.decision_route=old.decision||p.decision_route;p.profile={...p.profile,...old.profile};if(old.story?.summary)p.summary=old.story.summary+"\n\n"+p.summary;}
  p.match={ref:refOf(r.id)};
  const v=validateResearch(obj);if(!v.ok||v.errors.length){r.error="This result couldn't be read, so nothing was saved.";refreshLiveResearch();return;}
  r.saving=true;
  try{
    applyResearch(v,{[r.id]:a},S.notes);
    if(!S.demo){
      await Store.saveNote(r.id);
      if(Store.mode==="local"){
        const saved=JSON.parse(localStorage.getItem("fieldmind.v1")||"null");
        if(JSON.stringify(saved?.notes?.[r.id])!==JSON.stringify(S.notes[r.id]))throw Error("The brief could not be saved on this device.");
      }
    }
    r.state="saved";UI.briefTab="overview";openAccount(r.id);toast(S.demo?"Saved to the examples only.":"Findings saved.");
  }catch(error){if(previous)S.notes[r.id]=previous;else delete S.notes[r.id];r.error="Save failed. Your draft is still available; retry saving. "+error.message;refreshLiveResearch();}
  finally{r.saving=false;}
}

loadDemo();
render();
Store.init();
</script>
